baseURL = "https://xiebiao.com/"
assetDir = "static"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  author = "Bill Xie"
  mediaBaseURL = "https://media.xiebiao.com"

[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-CN"
    title = "于川海"
    weight = 2
    [languages.zh.params]
      homeTitle = "于川海 · 独立软件工程师"
      description = "于川海（Bill Xie）是一名生活在中国的独立软件工程师，分享独立产品、写作与摄影作品。"
      personDescription = "生活在中国的独立软件工程师，认真构建独立产品，并分享写作与摄影作品。"
      jobTitle = "独立软件工程师"
      knowsAbout = ["独立软件开发", "产品设计", "写作", "摄影"]
      ogLocale = "zh_CN"
  [languages.en]
    label = "English"
    locale = "en-US"
    title = "Bill Xie"
    weight = 1
    [languages.en.params]
      homeTitle = "Bill Xie · Independent Software Engineer"
      description = "Bill Xie is an independent software engineer in China building thoughtful products for himself, his daughter, for fun, and for a living."
      personDescription = "Independent software engineer in China building thoughtful products for himself, his daughter, for fun, and for a living."
      jobTitle = "Independent Software Engineer"
      knowsAbout = ["Independent software development", "Product design", "Writing", "Photography"]
      ogLocale = "en_US"

[permalinks]
  posts = "/posts/:slug/"
  projects = "/projects/:slug/"
  photos = "/photos/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = false
