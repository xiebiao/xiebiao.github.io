<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章图片管理</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; color: #262626; background: #f6f5f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem max(1rem, calc((100vw - 1180px) / 2)); border-bottom: 1px solid #ddd9d1; background: rgba(246,245,242,.94); backdrop-filter: blur(12px); }
    h1 { margin: 0; font-size: 1.2rem; }
    main { width: min(1180px, calc(100% - 2rem)); margin: 2rem auto 5rem; }
    .panel { padding: 1.25rem; border: 1px solid #ddd9d1; border-radius: 14px; background: #fff; }
    .upload-grid, .metadata-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; }
    label { display: grid; gap: .35rem; color: #666; font-size: .8rem; }
    input, textarea { width: 100%; padding: .7rem .75rem; border: 1px solid #d6d1c8; border-radius: 8px; background: #fff; color: #262626; }
    textarea { min-height: 5rem; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: 1rem; }
    button { padding: .65rem .9rem; border: 1px solid #cfc9bf; border-radius: 8px; background: #fff; color: #333; }
    button.primary { border-color: #262626; background: #262626; color: #fff; }
    button.danger { color: #a02132; }
    button:disabled { opacity: .5; cursor: wait; }
    .toolbar { display: flex; gap: .75rem; margin: 2rem 0 1rem; }
    .toolbar input { flex: 1; }
    .gallery { display: grid; border-top: 1px solid #ddd9d1; }
    .asset-list-header, .asset-summary { display: grid; grid-template-columns: 76px minmax(220px, 2fr) 100px minmax(180px, 220px) minmax(160px, 1fr) 24px; gap: 1rem; align-items: center; }
    .asset-list-header { padding: .65rem 1rem; color: #89857f; font-size: .72rem; letter-spacing: .04em; }
    .asset-row { border-bottom: 1px solid #ddd9d1; background: transparent; }
    .asset-summary { padding: .8rem 1rem; cursor: pointer; list-style: none; transition: background .15s ease; }
    .asset-summary::-webkit-details-marker { display: none; }
    .asset-summary:hover { background: rgba(255,255,255,.65); }
    .asset-row[open] > .asset-summary { background: #fff; }
    .row-thumb { width: 76px; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 6px; background: #eae7e1; }
    .row-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .row-main { display: grid; min-width: 0; gap: .2rem; }
    .row-main strong, .row-main span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-main span, .row-dimensions, .row-format, .row-refs { color: #78736c; font-size: .78rem; }
    .asset-id { color: #9a958e !important; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem !important; user-select: all; }
    .asset-id-detail { margin: -.35rem 0 .8rem; color: #78736c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem; overflow-wrap: anywhere; user-select: all; }
    .row-chevron { color: #89857f; font-size: 1rem; transition: transform .15s ease; }
    .asset-row[open] .row-chevron { transform: rotate(90deg); }
    .asset-details { display: grid; grid-template-columns: minmax(240px, 360px) minmax(0, 1fr); gap: 1.25rem; padding: 1.25rem; border-top: 1px solid #ebe8e2; background: #fff; }
    .preview { aspect-ratio: 3 / 2; display: grid; place-items: center; overflow: hidden; background: #eae7e1; }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { min-width: 0; }
    .asset-title { display: flex; justify-content: space-between; gap: .75rem; margin-bottom: .8rem; }
    .asset-title strong { overflow-wrap: anywhere; }
    .muted { color: #89857f; font-size: .75rem; }
    .refs { min-height: 1.3rem; margin-top: .65rem; color: #786f66; font-size: .75rem; }
    .variant-info { display: flex; flex-wrap: wrap; gap: .45rem; margin: .8rem 0; }
    .variant-info span { padding: .3rem .5rem; border-radius: 6px; background: #f1efeb; color: #69645d; font-size: .72rem; }
    .content-picker { display: grid; gap: .55rem; padding: .65rem; border: 1px solid #d6d1c8; border-radius: 8px; background: #fff; }
    .content-picker-tools { display: grid; grid-template-columns: 1fr 1fr auto; gap: .45rem; }
    .content-picker-tools input { padding: .5rem .6rem; }
    .content-picker-tools button { padding: .5rem .7rem; }
    .content-options { display: grid; gap: .25rem; max-height: 11rem; overflow: auto; }
    .content-option { display: flex; align-items: center; gap: .55rem; padding: .4rem .45rem; border-radius: 6px; color: #333; font-size: .8rem; }
    .content-option:hover { background: #f6f5f2; }
    .content-option input { width: auto; margin: 0; }
    .content-option-text { display: flex; min-width: 0; flex: 1; align-items: baseline; justify-content: space-between; gap: .75rem; }
    .content-option-text span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .content-picker-empty { margin: .4rem; color: #89857f; font-size: .75rem; }
    #status { min-height: 1.25rem; color: #67625b; font-size: .85rem; }
    #status.error { color: #a02132; }
    .empty { padding: 4rem 1rem; text-align: center; color: #89857f; }
    @media (max-width: 760px) { .upload-grid, .metadata-grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } header { padding-inline: 1rem; } .content-picker-tools { grid-template-columns: 1fr; } .asset-list-header { display: none; } .asset-summary { grid-template-columns: 64px minmax(0, 1fr) auto; padding-inline: .5rem; } .row-thumb { width: 64px; } .row-format, .row-refs { display: none; } .asset-details { grid-template-columns: 1fr; padding: 1rem .5rem; } }
  </style>
</head>
<body>
  <header><h1>文章图片管理</h1><div class="actions"><input id="import-file" type="file" accept="application/json,.json" hidden><button id="import" type="button">恢复清单</button><button id="export" type="button">导出 Hugo 清单</button></div></header>
  <main>
    <form id="upload" class="panel">
      <div class="upload-grid">
        <label class="wide">原图（JPEG、PNG、GIF，最大 50 MiB）<input name="image" type="file" accept="image/jpeg,image/png,image/gif" required></label>
        <label>替代文本<input name="alt" required placeholder="准确描述图片内容"></label>
        <label>说明<input name="caption" placeholder="显示在图片下方"></label>
        <label>标签<input name="tags" placeholder="摄影, 青海"></label>
        <label>拍摄时间<input name="takenAt" type="date"></label>
        <label>地点<input name="location"></label>
        <label>版权<input name="copyright" value="Bill Xie"></label>
        <label class="wide">关联文章<div id="upload-article-refs"></div></label>
      </div>
      <div class="actions"><button class="primary" type="submit">处理并上传</button><span id="status" role="status" aria-live="polite"></span></div>
    </form>
    <div class="toolbar"><input id="search" type="search" placeholder="搜索文件名、替代文本、地点或标签"><button id="refresh" type="button">刷新</button></div>
    <section id="gallery" class="gallery" aria-live="polite"></section>
  </main>
  <script>
    const gallery = document.querySelector('#gallery');
    const status = document.querySelector('#status');
    const search = document.querySelector('#search');
    const upload = document.querySelector('#upload');
    let contentItems = [];
    const setStatus = (message, error = false) => { status.textContent = message; status.className = error ? 'error' : ''; };
    async function api(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.error || `${response.status} ${response.statusText}`);
      }
      return response.status === 204 ? null : response.json();
    }
    function input(name, value = '') {
      const label = document.createElement('label');
      label.textContent = name;
      const field = document.createElement('input');
      field.name = name;
      field.value = value;
      field.dataset.metadata = '';
      label.append(field);
      return label;
    }
    function contentPicker(name, selectedValues = []) {
      const selected = new Set(selectedValues);
      const wrapper = document.createElement('div'); wrapper.className = 'content-picker';
      const tools = document.createElement('div'); tools.className = 'content-picker-tools';
      const filter = document.createElement('input'); filter.type = 'search'; filter.placeholder = '搜索 Posts 或 Photos';
      const custom = document.createElement('input'); custom.placeholder = '手动引用，例如 posts/example';
      const add = document.createElement('button'); add.type = 'button'; add.textContent = '添加';
      const options = document.createElement('div'); options.className = 'content-options';
      const hidden = document.createElement('input'); hidden.type = 'hidden'; hidden.name = name; hidden.dataset.metadata = '';
      const sync = () => { hidden.value = [...selected].sort().join(', '); };
      const candidates = () => {
        const known = new Set(contentItems.map(item => item.ref));
        const manual = [...selected].filter(ref => !known.has(ref)).map(ref => ({ref, title: ref, section: 'manual', languages: []}));
        return [...contentItems, ...manual];
      };
      const render = () => {
        const needle = filter.value.trim().toLowerCase();
        const matches = candidates().filter(item => !needle || `${item.title} ${item.ref} ${item.section}`.toLowerCase().includes(needle));
        const rows = matches.map(item => {
          const row = document.createElement('label'); row.className = 'content-option';
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = selected.has(item.ref);
          checkbox.onchange = () => { checkbox.checked ? selected.add(item.ref) : selected.delete(item.ref); sync(); render(); };
          const text = document.createElement('span'); text.className = 'content-option-text';
          const title = document.createElement('span'); title.textContent = item.title;
          const meta = document.createElement('span'); meta.className = 'muted'; meta.textContent = `${item.section}${item.languages.length ? ` · ${item.languages.join('/')}` : ''}`;
          text.append(title, meta); row.append(checkbox, text); return row;
        });
        options.replaceChildren(...rows);
        if (!rows.length) { const empty = document.createElement('p'); empty.className = 'content-picker-empty'; empty.textContent = '没有匹配的内容。'; options.append(empty); }
      };
      const addCustom = () => {
        const ref = custom.value.trim().replace(/^\/+|\/+$/g, '');
        if (!ref) return;
        selected.add(ref); custom.value = ''; sync(); render();
      };
      filter.addEventListener('input', render);
      custom.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); addCustom(); } });
      add.onclick = addCustom;
      tools.append(filter, custom, add); wrapper.append(tools, options, hidden); sync(); render(); return wrapper;
    }
    function mountUploadPicker() {
      document.querySelector('#upload-article-refs').replaceChildren(contentPicker('articleRefs'));
    }
    function renderListHeader() {
      const header = document.createElement('div'); header.className = 'asset-list-header'; header.setAttribute('aria-hidden', 'true');
      for (const text of ['', '图片', '原图尺寸', '生成尺寸', '关联文章', '']) { const cell = document.createElement('span'); cell.textContent = text; header.append(cell); }
      return header;
    }
    function renderRow(asset) {
      const row = document.createElement('details'); row.className = 'asset-row';
      const summary = document.createElement('summary'); summary.className = 'asset-summary';
      const rowThumb = document.createElement('span'); rowThumb.className = 'row-thumb';
      const imageVariant = asset.variants.filter(item => item.format === 'webp').at(-1) || asset.variants.at(-1);
      if (imageVariant) { const image = document.createElement('img'); image.src = imageVariant.url; image.alt = ''; image.loading = 'lazy'; rowThumb.append(image); }
      const rowMain = document.createElement('span'); rowMain.className = 'row-main';
      const rowName = document.createElement('strong'); rowName.textContent = asset.filename;
      const rowId = document.createElement('span'); rowId.className = 'asset-id'; rowId.textContent = `ID: ${asset.id}`;
      const rowAlt = document.createElement('span'); rowAlt.textContent = asset.alt;
      rowMain.append(rowName, rowId, rowAlt);
      const rowDimensions = document.createElement('span'); rowDimensions.className = 'row-dimensions'; rowDimensions.textContent = `${asset.width}×${asset.height}`;
      const rowFormat = document.createElement('span'); rowFormat.className = 'row-format';
      const webpVariants = asset.variants.filter(item => item.format === 'webp');
      rowFormat.textContent = webpVariants.length ? webpVariants.map(item => `${item.width}×${item.height}`).join(' · ') : '旧版动态地址';
      const rowRefs = document.createElement('span'); rowRefs.className = 'row-refs'; rowRefs.textContent = asset.articleRefs.length ? asset.articleRefs.join('、') : '未关联';
      const rowChevron = document.createElement('span'); rowChevron.className = 'row-chevron'; rowChevron.textContent = '›';
      summary.append(rowThumb, rowMain, rowDimensions, rowFormat, rowRefs, rowChevron);
      const detailPanel = document.createElement('div'); detailPanel.className = 'asset-details';
      const preview = document.createElement('div'); preview.className = 'preview';
      if (imageVariant) { const image = document.createElement('img'); image.src = imageVariant.url; image.alt = asset.alt; image.loading = 'lazy'; preview.append(image); }
      const body = document.createElement('div'); body.className = 'card-body';
      const title = document.createElement('div'); title.className = 'asset-title';
      const name = document.createElement('strong'); name.textContent = asset.filename;
      const size = document.createElement('span'); size.className = 'muted'; size.textContent = `${asset.width}×${asset.height}`;
      title.append(name, size);
      const assetId = document.createElement('div'); assetId.className = 'asset-id-detail'; assetId.textContent = `Asset ID: ${asset.id}`;
      const fields = document.createElement('div'); fields.className = 'metadata-grid';
      const values = { alt: asset.alt, caption: asset.caption, takenAt: asset.takenAt, location: asset.location, copyright: asset.copyright, tags: asset.tags.join(', ') };
      for (const [key, value] of Object.entries(values)) fields.append(input(key, value));
      const refsField = document.createElement('label'); refsField.className = 'wide'; refsField.textContent = '关联文章'; refsField.append(contentPicker('articleRefs', asset.articleRefs)); fields.append(refsField);
      const variantInfo = document.createElement('div'); variantInfo.className = 'variant-info';
      for (const variant of asset.variants) {
        const item = document.createElement('span');
        const size = variant.size ? ` · ${(variant.size / 1024).toFixed(1)} KiB` : '';
        item.textContent = `${variant.width}×${variant.height} ${variant.format.toUpperCase()}${size}`;
        variantInfo.append(item);
      }
      const refs = document.createElement('div'); refs.className = 'refs'; refs.textContent = asset.articleRefs.length ? `引用：${asset.articleRefs.join('、')}` : '没有文章引用';
      const actions = document.createElement('div'); actions.className = 'actions';
      const save = document.createElement('button'); save.textContent = '保存元数据';
      save.onclick = async () => {
        const metadata = Object.fromEntries([...fields.querySelectorAll('[data-metadata]')].map(field => [field.name, field.value]));
        metadata.tags = metadata.tags.split(/[,，\n]/).map(v => v.trim()).filter(Boolean);
        metadata.articleRefs = metadata.articleRefs.split(/[,，\n]/).map(v => v.trim()).filter(Boolean);
        try { save.disabled = true; await api(`/api/assets/${asset.id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(metadata)}); setStatus('元数据已保存并导出。'); await load(); }
        catch (error) { setStatus(error.message, true); } finally { save.disabled = false; }
      };
      const copy = document.createElement('button'); copy.textContent = '复制 shortcode';
      copy.onclick = async () => { await navigator.clipboard.writeText(`{{< figure asset="${asset.id}" >}}`); setStatus('shortcode 已复制。'); };
      const copyUrl = document.createElement('button'); copyUrl.textContent = '复制图片地址';
      copyUrl.onclick = async () => {
        const variant = asset.variants.filter(item => item.format === 'webp').at(-1) || asset.variants.at(-1);
        if (!variant) { setStatus('这张图片没有可复制的地址。', true); return; }
        try { await navigator.clipboard.writeText(variant.url); setStatus(`已复制 ${variant.width}px 图片地址。`); }
        catch (error) { setStatus(`复制失败：${error.message}`, true); }
      };
      const migrate = document.createElement('button'); migrate.textContent = '生成并存储 WebP';
      migrate.onclick = async () => {
        try { migrate.disabled = true; setStatus('正在通过 Cloudflare 生成 WebP 并存入 R2…'); await api(`/api/assets/${asset.id}/variants`, {method:'POST'}); setStatus('WebP 已生成并永久存入 R2。'); await load(); }
        catch (error) { setStatus(error.message, true); } finally { migrate.disabled = false; }
      };
      const remove = document.createElement('button'); remove.className = 'danger'; remove.textContent = '删除';
      remove.onclick = async () => { if (!confirm(`删除 ${asset.filename} 及全部 R2 派生文件？`)) return; try { await api(`/api/assets/${asset.id}`, {method:'DELETE'}); setStatus('图片已删除。'); await load(); } catch (error) { setStatus(error.message, true); } };
      actions.append(save, copy, copyUrl); if (asset.variants.some(item => item.format !== 'webp')) actions.append(migrate); actions.append(remove); body.append(title, assetId, variantInfo, fields, refs, actions); detailPanel.append(preview, body); row.append(summary, detailPanel); return row;
    }
    async function load() {
      try {
        const assets = await api(`/api/assets?q=${encodeURIComponent(search.value.trim())}`);
        gallery.replaceChildren(...(assets.length ? [renderListHeader(), ...assets.map(renderRow)] : []));
        if (!assets.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = '还没有匹配的图片。'; gallery.append(empty); }
      } catch (error) { setStatus(error.message, true); }
    }
    async function loadContent() {
      try { contentItems = await api('/api/content'); }
      catch (error) { contentItems = []; setStatus(error.message, true); }
      mountUploadPicker();
    }
    upload.addEventListener('submit', async event => {
      event.preventDefault(); const button = upload.querySelector('button[type=submit]');
      try {
        button.disabled = true; setStatus('正在上传原图，并通过 Cloudflare 生成 WebP，请稍候…');
        const form = new FormData(upload); const file = form.get('image');
        if (file instanceof File) { try { const bitmap = await createImageBitmap(file, {imageOrientation:'from-image'}); form.set('displayWidth', String(bitmap.width)); form.set('displayHeight', String(bitmap.height)); bitmap.close(); } catch (_) {} }
        await api('/api/assets', {method:'POST', body:form}); upload.reset(); mountUploadPicker(); setStatus('上传完成，WebP 已永久存入 R2，Hugo 清单已更新。'); await load();
      }
      catch (error) { setStatus(error.message, true); } finally { button.disabled = false; }
    });
    document.querySelector('#refresh').onclick = async () => { await loadContent(); await load(); };
    document.querySelector('#export').onclick = async () => { try { const result = await api('/api/export', {method:'POST'}); setStatus(`已导出到 ${result.manifest}`); } catch (error) { setStatus(error.message, true); } };
    const importFile = document.querySelector('#import-file');
    document.querySelector('#import').onclick = () => importFile.click();
    importFile.onchange = async () => { const file = importFile.files[0]; if (!file || !confirm('用这个清单替换本地 SQLite 目录？R2 对象不会被修改。')) return; try { const result = await api('/api/import', {method:'POST', headers:{'Content-Type':'application/json'}, body:await file.text()}); setStatus(`已恢复 ${result.assets} 张图片。`); await load(); } catch (error) { setStatus(error.message, true); } finally { importFile.value = ''; } };
    let timer; search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 200); });
    loadContent().then(load);
  </script>
</body>
</html>
