{{ define "main" }}
<main class="photo-story photo-single-page">
  <nav class="photo-single-topbar" aria-label="{{ i18n "navigationAria" }}">
    <a href="{{ "photos/" | relLangURL }}">{{ i18n "photoBack" }}</a>
  </nav>
  <div class="photo-story-gallery">
    {{ range $image := .Params.images }}
    <figure class="photo-story-frame">
      {{ partial "photo-image.html" (dict "image" $image "location" $.Params.location "date" ($.Date | time.Format ":date_long") "dateISO" ($.Date.Format "2006-01-02") "eager" false "sizes" "(max-width: 760px) calc(100vw - 2rem), 960px") }}
    </figure>
    {{ end }}
  </div>
  <header class="photo-story-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="photo-story-intro">{{ . }}</div>{{ end }}
  </header>
  {{ partial "photo-navigation.html" . }}
</main>
{{ end }}
