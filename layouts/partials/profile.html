<aside class="profile" aria-label="{{ i18n "profileAria" }}">
  <a class="profile-avatar-link" href="{{ site.Home.RelPermalink }}">
    <picture class="profile-avatar-picture">
      <source srcset="{{ "images/my-avatar-256.webp" | relURL }}" type="image/webp">
      <img class="profile-avatar" src="{{ "images/my-avatar-256.png" | relURL }}" alt="Biao Xie" width="256" height="256">
    </picture>
  </a>
  <div class="profile-copy">
    <h1 class="profile-name">{{ i18n "profileName" }}</h1>
    <a class="profile-site" href="{{ site.Home.RelPermalink }}">xiebiao.com</a>
  </div>
  <nav class="projects" aria-label="{{ i18n "navigationAria" }}">
    <h2>{{ i18n "contentLabel" }}</h2>
    <a class="project-link{{ if eq .Section "projects" }} is-active{{ end }}" href="{{ "projects/" | relLangURL }}">
      <span class="project-link-title"><span class="project-name">{{ i18n "projectsLabel" }}</span></span>
    </a>
    <a class="project-link{{ if eq .Section "posts" }} is-active{{ end }}" href="{{ "posts/" | relLangURL }}">
      <span class="project-link-title"><span class="project-name">{{ i18n "postsLabel" }}</span></span>
    </a>
    <a class="project-link{{ if eq .Section "photos" }} is-active{{ end }}" href="{{ "photos/" | relLangURL }}">
      <span class="project-link-title"><span class="project-name">{{ i18n "photosLabel" }}</span></span>
    </a>
  </nav>
</aside>
