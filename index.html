<body>

  <main class="site-layout">
    <aside class="profile" aria-label="Personal information">
      <a class="profile-avatar-link" href="https://xiebiao.com" target="_blank" rel="noopener noreferrer">
        <picture class="profile-avatar-picture">
          <source srcset="images/my-avatar-256.webp" type="image/webp">
          <img class="profile-avatar" src="images/my-avatar-256.png" alt="Biao Xie" width="256" height="256">
        </picture>
      </a>
      <div class="profile-copy">
        <h1 class="profile-name" data-i18n="profileName">于川海</h1>
        <a class="profile-site" href="https://xiebiao.com" target="_blank" rel="noopener noreferrer">xiebiao.com</a>
      </div>
      <nav class="projects" aria-label="Projects">
        <h2 data-i18n="projectsLabel">项目</h2>
        <a class="project-link project-link-external" href="https://pushbeat.app" target="_blank" rel="noopener noreferrer">
          <span class="project-link-title">
            <img class="project-logo" src="images/pushbeat-mark.svg" alt="" width="16" height="16">
            <span class="project-name">PushBeat</span>
            <span class="external-arrow" aria-hidden="true">↗</span>
          </span>
          <span class="project-description" data-i18n="pushbeatDescription">训练计时器</span>
        </a>
      </nav>
      <div class="social-links" aria-label="Social links">
        <a href="https://x.com/joyrap" target="_blank" rel="noopener noreferrer" aria-label="X">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">

          </svg>
        </a>
        <a href="https://www.douban.com/people/xiebiao80/" target="_blank" rel="noopener noreferrer" aria-label="豆瓣">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M.51 3.06h22.98V.755H.51V3.06Zm20.976 2.537v9.608h-2.137l-1.669 5.76H24v2.28H0v-2.28h6.32l-1.67-5.76H2.515V5.597h18.972Zm-5.066 9.608H7.58l1.67 5.76h5.501l1.67-5.76ZM18.367 7.9H5.634v5.025h12.733V7.9Z"></path>
          </svg>

        <a href="https://www.instagram.com/pushbeat.app" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6Zm9.65 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"></path>
          </svg>
        </a>
      </div>
    </aside>
    <section class="project-content" id="yuchuanhai" aria-labelledby="project-heading">
      <h2 class="visually-hidden" id="project-heading">于川海</h2>
      <div class="grid-container fluid">
        <div class="grid-x align-center">
          <div class="cell small-12">
          <figure>
            <a class="photo-link" href="?photo=2#yuchuanhai" aria-label="查看下一张照片">
            <picture>
              <!-- 移动端：按实际显示宽度选择轻量图片，最大不超过 720px -->
              <source
                class="photo-source-mobile"
                media="(max-width: 600px)"
                srcset="images/photo-480w.jpg 480w,
                        images/photo-720w.jpg 720w"
                sizes="calc(100vw - 2rem)">
              <!-- 平板与桌面端：按实际显示宽度和像素密度选图 -->
              <source
                class="photo-source-desktop"
                srcset="images/photo-960w.jpg 960w,
                        images/photo-1440w.jpg 1440w,
                        images/photo-1920w.jpg 1920w,
                        images/photo-2880w.jpg 2880w"
                sizes="(max-width: 992px) calc(100vw - 2rem), 960px">
              <img
                class="main-photo"
                src="images/photo-960w.jpg"
                alt="Biao Xie"
                width="1920"
                height="1080"
                loading="lazy">
            </picture>
            </a>
            <p class="subtitle" data-i18n="subtitle">二零二五·八月·中国·青海茫崖冷湖</p>
          </figure>
          <div class="poem photo-copy photo-copy-primary">
            <p data-i18n="poemLine1">傍晚</p>
            <p data-i18n="poemLine2">躺在丰收后的油菜地里</p>
            <p data-i18n="poemLine3">仰望着故乡的天空</p>
            <p data-i18n="poemLine4">有几只飞鸟</p>
            <p data-i18n="poemLine5">吃掉了刚刚升起的星星</p>
            <br>
            <p data-i18n="poemLine6">那一夜</p>
            <p data-i18n="poemLine7">睡得很深，深到土里</p>
          </div>
          <div class="poem photo-copy photo-copy-secondary" hidden>
            <p data-i18n="quoteLine1">世界上只有一种真正的英雄主义</p>
            <p data-i18n="quoteLine2">那就是在认清生活的真相之后</p>
            <p data-i18n="quoteLine3">依然热爱生活</p>
            <br>
            <p class="quote-author" data-i18n="quoteAuthor">—— 罗曼·罗兰</p>
          </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const photoLink = document.querySelector('.photo-link');
    const mobilePhotoSource = document.querySelector('.photo-source-mobile');
    const desktopPhotoSource = document.querySelector('.photo-source-desktop');
    const mainPhoto = document.querySelector('.main-photo');
    const photoSubtitle = document.querySelector('.subtitle');
    const primaryPhotoCopy = document.querySelector('.photo-copy-primary');
    const secondaryPhotoCopy = document.querySelector('.photo-copy-secondary');
    const isSecondPhoto = new URLSearchParams(window.location.search).get('photo') === '2';

    if (isSecondPhoto) {
      mobilePhotoSource.srcset = 'images/blog-photo-480w.jpg 360w, images/blog-photo-960w.jpg 720w';
      desktopPhotoSource.srcset = 'images/blog-photo-960w.jpg 720w, images/blog-photo-1920w.jpg 1440w';
      mobilePhotoSource.sizes = '(max-width: 512px) 82vw, 420px';
      desktopPhotoSource.sizes = '(max-width: 760px) 82vw, 620px';
      mainPhoto.src = 'images/blog-photo-960w.jpg';
      mainPhoto.width = 1440;
      mainPhoto.height = 1920;
      mainPhoto.alt = '收获后的田野与白桦林';
      photoSubtitle.hidden = true;
      primaryPhotoCopy.hidden = true;
      secondaryPhotoCopy.hidden = false;
      photoLink.classList.add('is-portrait');
      photoLink.href = './#yuchuanhai';
      photoLink.setAttribute('aria-label', '返回上一张照片');
    }

    const translations = {
      zh: {
        title: '于川海',
        profileName: '于川海',
        projectsLabel: '项目',
        pushbeatDescription: '训练计时器',
        subtitle: '二零二五·八月·中国·青海茫崖冷湖',
        poemLine1: '傍晚',
        poemLine2: '躺在丰收后的油菜地里',
        poemLine3: '仰望着故乡的天空',
        poemLine4: '有几只飞鸟',
        poemLine5: '吃掉了刚刚升起的星星',
        poemLine6: '那一夜',
        poemLine7: '睡得很深，深到土里',
        quoteLine1: '世界上只有一种真正的英雄主义',
        quoteLine2: '那就是在认清生活的真相之后',
        quoteLine3: '依然热爱生活',
        quoteAuthor: '—— 罗曼·罗兰'
      },
      en: {
        title: 'Bill Xie',
        profileName: 'Bill Xie',
        projectsLabel: 'Projects',
        pushbeatDescription: 'Fitness Timer',
        subtitle: 'August 2025 · Lenghu, Mangya, Qinghai, China',
        poemLine1: 'At dusk',
        poemLine2: 'I lay in a rapeseed field after the harvest',
        poemLine3: 'gazing up at the sky above my hometown',
        poemLine4: 'a few birds',
        poemLine5: 'ate the stars that had just risen',
        poemLine6: 'That night',
        poemLine7: 'I slept deeply, deep into the earth',
        quoteLine1: 'There is only one true heroism in the world:',
        quoteLine2: 'to see life as it really is',
        quoteLine3: 'and still love it.',
        quoteAuthor: '— Romain Rolland'
      }
    };

    const languageToggle = document.querySelector('.language-toggle');

    function setLanguage(language) {
      const copy = translations[language];
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.title = copy.title;
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        element.textContent = copy[element.dataset.i18n];
      });
      languageToggle.textContent = language === 'zh' ? 'English' : '中文';
      languageToggle.setAttribute(
        'aria-label',
        language === 'zh' ? 'Switch to English' : '切换到中文'
      );
      localStorage.setItem('language', language);
    }

    const savedLanguage = localStorage.getItem('language');
    setLanguage(savedLanguage === 'en' ? 'en' : 'zh');

    languageToggle.addEventListener('click', () => {
      setLanguage(document.documentElement.lang === 'en' ? 'zh' : 'en');
    });
  </script>
</body>
</html>
